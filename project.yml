name: NYCGayBars
options:
  bundleIdPrefix: com.normanhoang
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: DZRPJF9JB6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "12"
targets:
  NYCGayBars:
    type: application
    platform: iOS
    sources:
      - NYCGayBars
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanhoang.nycgaybars
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # aps-environment is resolved at codesign time from this setting:
        # Debug device runs keep development APNs routing; Release archives
        # get production (required for TestFlight/App Store). See FINDINGS.md #4.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      path: NYCGayBars/NYCGayBars.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.normanhoang.nycgaybars
    info:
      path: NYCGayBars/Info.plist
      properties:
        CFBundleDisplayName: NYC Gay Bars
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: "Used to show your distance to bars and sort them by proximity."
        LSApplicationQueriesSchemes:
          - instagram
        CFBundleURLTypes:
          - CFBundleURLName: com.normanhoang.nycgaybars
            CFBundleURLSchemes:
              - nycgaybars
  NYCGayBarsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NYCGayBarsTests
    dependencies:
      - target: NYCGayBars
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
