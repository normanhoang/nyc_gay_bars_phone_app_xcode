<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add me — NYC Gay Bars</title>
  <style>
    body { margin:0; font:17px/1.6 -apple-system, system-ui, sans-serif; color:#f4eefb;
           background:linear-gradient(160deg,#160a1f,#241033); min-height:100vh;
           display:flex; align-items:center; justify-content:center; text-align:center; }
    .card { max-width:340px; padding:32px 24px; }
    h1 { font-size:1.5rem; margin:0 0 8px; }
    h1 span { background:linear-gradient(90deg,#ff2d92,#a855f7); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { color:#b39dc9; margin:8px 0 20px; }
    .code { font-family:ui-monospace,Menlo,monospace; font-size:2rem; font-weight:800;
            color:#ff2d92; letter-spacing:.15em; margin:12px 0 24px; user-select:all; }
    a.btn { display:block; background:#ff2d92; color:#fff; font-weight:700; text-decoration:none;
            padding:14px 20px; border-radius:30px; margin-bottom:12px; }
    a.btn.appstore { background:none; border:1px solid #3a2450; color:#f4eefb; }
    button.copy { background:none; border:1px solid #3a2450; color:#b39dc9; padding:10px 18px;
                  border-radius:30px; font:inherit; font-size:.9rem; cursor:pointer; }
    .hint { font-size:.8rem; color:#7d6795; margin-top:24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Add me on <span>NYC Gay Bars</span></h1>
    <p>My friend code:</p>
    <div class="code" id="code">——————</div>
    <a class="btn" id="open" href="#">Open in NYC Gay Bars</a>
    <a class="btn appstore" id="store" href="#">Get it on the App Store</a>
    <button class="copy" id="copy">Copy code</button>
    <p class="hint">Have the app? Tap “Open”. New here? Get the app, then add me with the code above.</p>
  </div>
  <script>
    const APP_STORE_URL = 'https://apps.apple.com/us/app/nycgaybars/id6786098139';
    // Code rides in the fragment so it never reaches server logs.
    const code = (location.hash || '').replace('#', '').trim().toUpperCase();
    if (code) {
      document.getElementById('code').textContent = code;
      document.getElementById('open').href = 'nycgaybars://addfriend?code=' + encodeURIComponent(code);
    }
    document.getElementById('store').href = APP_STORE_URL;
    document.getElementById('copy').addEventListener('click', () => {
      navigator.clipboard.writeText(code);
      document.getElementById('copy').textContent = 'Copied!';
    });
  </script>
</body>
</html>
